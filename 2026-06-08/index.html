<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>海底光療</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}

html{ height:100%; }
body{
  width:100%;height:100%;
  overflow:hidden;
  position:fixed;top:0;left:0;right:0;bottom:0;
  font-family:'Zen Maru Gothic','PingFang TC','Apple Color Emoji',sans-serif;
  background:#0d2a35;
  touch-action:none;
  display:flex;
  justify-content:center;
}

/* ── 最大寬度容器 ── */
#viewport{
  position:relative;
  width:100%;
  max-width:480px;
  height:100%;
  overflow:hidden;
}

/* ════════════════════════════════════
   入場畫面
════════════════════════════════════ */
#intro{
  position:absolute;top:0;left:0;width:100%;height:100%;
  z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,3vw,16px);
  overflow:hidden;
  transition: opacity 2s ease;
}
#intro.fade{ opacity:0; pointer-events:none; }

#intro-bg{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background: #A0D1D8;
}

#intro-waves{
  position:absolute;bottom:0;left:0;width:100%;
  pointer-events:none;
  opacity:0.5;
}

#intro-glow{
  position:absolute;
  width:min(340px,90vw);height:min(340px,90vw);
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.45) 0%, rgba(160,209,216,0) 70%);
  top:50%;left:50%;
  transform:translate(-50%,-58%);
  animation:glow-pulse 4s ease-in-out infinite;
  pointer-events:none;
}
@keyframes glow-pulse{
  0%,100%{ transform:translate(-50%,-58%) scale(1);   opacity:0.7; }
  50%{     transform:translate(-50%,-58%) scale(1.12); opacity:1; }
}

.intro-bubble{
  position:absolute;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%, rgba(255,255,255,0.7), rgba(255,255,255,0.1));
  border:1px solid rgba(255,255,255,0.5);
  animation:intro-rise var(--d,8s) ease-in infinite;
  animation-delay:var(--dl,0s);
}
@keyframes intro-rise{
  0%  { transform:translateY(0) translateX(0);   opacity:0; }
  10% { opacity:0.7; }
  90% { opacity:0.4; }
  100%{ transform:translateY(-110vh) translateX(var(--rx,10px)); opacity:0; }
}

.intro-title{
  position:relative;z-index:1;
  font-size:clamp(22px,6vw,28px);
  font-weight:700;
  color:white;
  letter-spacing:0.18em;
  text-shadow:0 0 24px rgba(80,180,200,0.6), 0 2px 8px rgba(0,0,0,0.1);
}
.intro-sub{
  position:relative;z-index:1;
  font-size:clamp(12px,3.2vw,14px);
  color:rgba(255,255,255,0.75);
  letter-spacing:0.1em;
}
.btn-enter{
  position:relative;z-index:1;
  margin-top:8px;
  border:1.5px solid rgba(255,255,255,0.6);
  background:rgba(255,255,255,0.18);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  color:white;
  border-radius:99px;
  padding:clamp(12px,3.5vw,15px) clamp(32px,9vw,44px);
  font-family:inherit;
  font-size:clamp(14px,4vw,16px);
  font-weight:500;
  letter-spacing:0.1em;
  cursor:pointer;
  transition:background 0.3s, transform 0.2s;
}
.btn-enter:active{ transform:scale(0.96); }

/* ════════════════════════════════════
   潛水中畫面
════════════════════════════════════ */
#bg{
  position:absolute;top:0;left:0;width:100%;height:100%;
  z-index:0;
  background-image:url('diving.png');
  background-size:cover;
  background-position:center center;
  filter:brightness(0.78) saturate(1.1);
}

#light-overlay{
  position:absolute;top:0;left:0;width:100%;height:100%;
  z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 60% 80% at 50% 0%, rgba(120,210,230,0.20) 0%, transparent 65%);
  animation:light-pulse 8s ease-in-out infinite;
}
@keyframes light-pulse{
  0%,100%{ opacity:0.6; }
  50%{     opacity:1; }
}

#color-wash{
  position:absolute;top:0;left:0;width:100%;height:100%;
  z-index:2;pointer-events:none;
  opacity:0;
  transition:background 6s ease, opacity 3s ease;
}

.ray{
  position:absolute;top:0;
  width:2px;height:70%;
  transform-origin:top center;
  pointer-events:none;z-index:2;
  background:linear-gradient(to bottom, rgba(160,225,240,0.18), transparent);
  animation:ray-sway var(--d,10s) ease-in-out infinite;
  animation-delay:var(--dl,0s);
  opacity:0;
  transition:opacity 3s;
}
@keyframes ray-sway{
  0%,100%{ transform:rotate(var(--r1,-4deg)) scaleY(0.85); opacity:var(--op,0.4); }
  50%{     transform:rotate(var(--r2, 4deg)) scaleY(1.1);  opacity:calc(var(--op,0.4)*1.5); }
}

.bubble{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, rgba(255,255,255,0.55), rgba(200,240,240,0.15));
  border:1px solid rgba(255,255,255,0.3);
  pointer-events:none;z-index:3;
  animation:bubble-rise var(--rise,12s) ease-in forwards;
  opacity:0;
}
@keyframes bubble-rise{
  0%  { transform:translateY(0) translateX(0); opacity:0; }
  8%  { opacity:0.7; }
  90% { opacity:0.5; }
  100%{ transform:translateY(var(--ry,-120vh)) translateX(var(--rx,20px)); opacity:0; }
}

#blessing-wrap{
  position:absolute;
  bottom:clamp(110px,22vh,170px);
  left:0;right:0;
  z-index:10;
  display:flex;flex-direction:column;align-items:center;
  pointer-events:none;
}
#blessing-text{
  font-size:clamp(16px,4.5vw,20px);
  font-weight:500;
  color:white;
  text-align:center;
  line-height:1.85;
  letter-spacing:0.08em;
  text-shadow:0 0 20px rgba(100,200,220,0.8), 0 2px 12px rgba(0,0,0,0.4);
  opacity:0;
  transform:translateY(6px);
  transition:opacity 1.8s ease, transform 1.8s ease;
  padding:0 clamp(24px,8vw,48px);
}
#blessing-text.show{ opacity:1; transform:translateY(0); }

#btn-leave{
  position:absolute;
  bottom:max(28px, env(safe-area-inset-bottom, 28px));
  left:50%;transform:translateX(-50%);
  z-index:20;
  border:1.5px solid rgba(255,255,255,0.45);
  background:rgba(255,255,255,0.12);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  color:rgba(255,255,255,0.9);
  border-radius:99px;
  padding:clamp(11px,3vw,14px) clamp(28px,8vw,40px);
  font-family:inherit;
  font-size:clamp(13px,3.5vw,15px);
  font-weight:500;
  letter-spacing:0.08em;
  cursor:pointer;
  opacity:0;pointer-events:none;
  transition:opacity 1.5s ease, transform 0.2s;
  white-space:nowrap;
}
#btn-leave.show{ opacity:1;pointer-events:auto; }
#btn-leave:active{ transform:translateX(-50%) scale(0.96); }

/* ════════════════════════════════════
   結束畫面
════════════════════════════════════ */
#finish{
  position:absolute;top:0;left:0;width:100%;height:100%;
  z-index:60;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity 2s ease;
  overflow:hidden;
}
#finish.show{ opacity:1;pointer-events:auto; }

#finish-bg{
  position:absolute;inset:0;
  background-image:url('finishdiving.png');
  background-size:cover;
  background-position:center top;
}
#finish-mask{
  position:absolute;inset:0;
  background:linear-gradient(
    to top,
    rgba(0,40,60,0.65) 0%,
    rgba(0,40,60,0.15) 50%,
    transparent 100%
  );
}

#finish-content{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(10px,3vw,16px);
  padding:0 clamp(24px,8vw,48px);
  margin-top:auto;
  padding-bottom:max(clamp(40px,12vw,70px), env(safe-area-inset-bottom, 40px));
}
#finish-quote{
  font-size:clamp(16px,4.5vw,20px);
  font-weight:500;
  color:white;
  text-align:center;
  line-height:1.85;
  letter-spacing:0.08em;
  text-shadow:0 2px 16px rgba(0,40,60,0.5), 0 0 24px rgba(160,220,230,0.4);
  opacity:0;
  transform:translateY(10px);
  transition:opacity 1.5s ease 0.5s, transform 1.5s ease 0.5s;
}
#finish-quote.show{ opacity:1;transform:translateY(0); }

#finish-icon{
  font-size:clamp(28px,8vw,36px);
  opacity:0;
  transition:opacity 1s ease 1.5s;
}
#finish-icon.show{ opacity:1; }
</style>
</head>
<body>

<div id="viewport">

<!-- ── 入場畫面 ── -->
<div id="intro">
  <div id="intro-bg"></div>
  <div id="intro-glow"></div>
  <div id="intro-bubbles"></div>
  <svg id="intro-waves" viewBox="0 0 375 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,40 C60,10 120,70 180,40 C240,10 300,70 375,40 L375,80 L0,80 Z" fill="rgba(255,255,255,0.18)">
      <animate attributeName="d" dur="5s" repeatCount="indefinite"
        values="M0,40 C60,10 120,70 180,40 C240,10 300,70 375,40 L375,80 L0,80 Z;
                M0,50 C60,20 120,60 180,50 C240,20 300,60 375,50 L375,80 L0,80 Z;
                M0,40 C60,10 120,70 180,40 C240,10 300,70 375,40 L375,80 L0,80 Z"/>
    </path>
    <path d="M0,55 C80,30 160,75 240,55 C300,40 340,65 375,55 L375,80 L0,80 Z" fill="rgba(255,255,255,0.10)">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="M0,55 C80,30 160,75 240,55 C300,40 340,65 375,55 L375,80 L0,80 Z;
                M0,60 C80,45 160,65 240,60 C300,50 340,55 375,60 L375,80 L0,80 Z;
                M0,55 C80,30 160,75 240,55 C300,40 340,65 375,55 L375,80 L0,80 Z"/>
    </path>
  </svg>
  <div class="intro-title">海底光療</div>
  <div class="intro-sub">讓光包圍你</div>
  <button class="btn-enter" onclick="startSession()">潛入海底</button>
</div>

<!-- ── 潛水中 ── -->
<div id="bg"></div>
<div id="light-overlay"></div>
<div id="color-wash"></div>
<div id="rays"></div>
<div id="bubbles"></div>

<div id="blessing-wrap">
  <div id="blessing-text"></div>
</div>
<button id="btn-leave" onclick="leaveSession()">輕輕浮出水面</button>

<!-- ── 結束畫面 ── -->
<div id="finish">
  <div id="finish-bg"></div>
  <div id="finish-mask"></div>
  <div id="finish-content">
    <div id="finish-quote">勇敢的你<br>今天也辛苦啦</div>
  </div>
</div>

</div><!-- end #viewport -->

<script>
// ── Line browser height fix ───────────────────────────────────────
function fixHeight(){
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.body.style.height = h + 'px';
  const vp = document.getElementById('viewport');
  if(vp) vp.style.height = h + 'px';
}
fixHeight();
window.addEventListener('resize', fixHeight);
window.addEventListener('load', () => setTimeout(fixHeight, 200));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', fixHeight);
  window.visualViewport.addEventListener('scroll', fixHeight);
}

// ── 祝福文字 ─────────────────────────────────────────────────────
const BLESSINGS = [
  '海裡很安靜\n讓這裡的平靜陪你一會兒',
  '在這裡只要呼吸\n什麼都不用做',
  '每一個泡泡升上去\n帶走一點今天的重量',
  '水會托住你\n這個世界也會',
  '你比你想的\n更能承受壓力',
  '放心\n你已經很了不起了',
];

const WASH_COLORS = [
  'rgba(80,180,200,0.14)',
  'rgba(60,160,190,0.14)',
  'rgba(100,200,210,0.12)',
  'rgba(70,170,195,0.14)',
  'rgba(90,190,205,0.12)',
  'rgba(60,155,185,0.14)',
];

let currentIdx = 0;
let blessingTimer = null;
let bubbleInterval = null;

// ── 入場泡泡 ─────────────────────────────────────────────────────
function buildIntroBubbles(){
  const c = document.getElementById('intro-bubbles');
  c.style.position = 'absolute';
  c.style.inset = '0';
  c.style.pointerEvents = 'none';
  for(let i = 0; i < 14; i++){
    const b = document.createElement('div');
    b.className = 'intro-bubble';
    const size = 6 + Math.random() * 18;
    b.style.width  = size + 'px';
    b.style.height = size + 'px';
    b.style.left   = (5 + Math.random() * 90) + '%';
    b.style.bottom = (-size) + 'px';
    b.style.setProperty('--d',  (6 + Math.random() * 8) + 's');
    b.style.setProperty('--dl', (-Math.random() * 8) + 's');
    b.style.setProperty('--rx', (Math.random() - 0.5) * 40 + 'px');
    c.appendChild(b);
  }
}
buildIntroBubbles();

// ── 光束 ─────────────────────────────────────────────────────────
function buildRays(){
  const container = document.getElementById('rays');
  for(let i = 0; i < 7; i++){
    const ray = document.createElement('div');
    ray.className = 'ray';
    ray.style.left = (15 + (i/6)*70) + '%';
    ray.style.setProperty('--d',  (8 + Math.random()*6) + 's');
    ray.style.setProperty('--dl', (-Math.random()*8) + 's');
    ray.style.setProperty('--r1', (-6 + i*1.5) + 'deg');
    ray.style.setProperty('--r2', (-3 + i*1.5) + 'deg');
    ray.style.setProperty('--op', (0.2 + Math.random()*0.3).toFixed(2));
    ray.style.height = (55 + Math.random()*20) + '%';
    container.appendChild(ray);
  }
}

function showRays(){
  document.querySelectorAll('.ray').forEach((r,i)=>{
    setTimeout(()=>{ r.style.opacity='1'; }, i*200);
  });
}

// ── 水中泡泡 ─────────────────────────────────────────────────────
function spawnBubble(){
  const container = document.getElementById('bubbles');
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = 4 + Math.random()*14;
  b.style.width  = size + 'px';
  b.style.height = size + 'px';
  b.style.left   = (5 + Math.random()*90) + '%';
  b.style.bottom = (-size) + 'px';
  const rise = 10 + Math.random()*12;
  b.style.setProperty('--rise', rise + 's');
  b.style.setProperty('--ry',   -(80+Math.random()*50) + '%');
  b.style.setProperty('--rx',   (Math.random()-0.5)*40 + 'px');
  container.appendChild(b);
  setTimeout(()=>b.remove(), (rise+1)*1000);
}

// ── 祝福切換 ─────────────────────────────────────────────────────
function showBlessing(idx){
  const el   = document.getElementById('blessing-text');
  const wash = document.getElementById('color-wash');
  el.classList.remove('show');
  setTimeout(()=>{
    el.innerHTML = BLESSINGS[idx].replace(/\n/g, '<br>');
    wash.style.background = `radial-gradient(ellipse 80% 80% at 50% 40%, ${WASH_COLORS[idx]}, transparent 70%)`;
    wash.style.opacity = '1';
    el.classList.add('show');
  }, 1000);
}

function nextBlessing(){
  currentIdx = (currentIdx+1) % BLESSINGS.length;
  showBlessing(currentIdx);
}

// ── 開始 ─────────────────────────────────────────────────────────
function startSession(){
  const intro = document.getElementById('intro');
  intro.classList.add('fade');
  setTimeout(()=>{ intro.style.display='none'; }, 2000);

  buildRays();
  showRays();
  spawnBubble();
  bubbleInterval = setInterval(spawnBubble, 1800);

  setTimeout(()=>{
    showBlessing(0);
    blessingTimer = setInterval(nextBlessing, 6000);
  }, 2000);

  setTimeout(()=>{
    document.getElementById('btn-leave').classList.add('show');
  }, 5000);
}

// ── 離開 ─────────────────────────────────────────────────────────
function leaveSession(){
  clearInterval(blessingTimer);
  clearInterval(bubbleInterval);

  document.getElementById('blessing-text').classList.remove('show');
  document.getElementById('btn-leave').classList.remove('show');

  const finish = document.getElementById('finish');
  finish.classList.add('show');

  setTimeout(()=>{
    document.getElementById('finish-quote').classList.add('show');
    document.getElementById('finish-icon').classList.add('show');
  }, 600);
}
</script>
</body>
</html>
