<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>今日成就解鎖</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}

html{height:100%;}
body{
  width:100%;height:100%;
  overflow:hidden;position:fixed;top:0;left:0;
  font-family:'Zen Maru Gothic','PingFang TC','Apple Color Emoji',sans-serif;
  background:#ede8e3;
  display:flex;justify-content:center;
  touch-action:none;
}

#viewport{
  position:relative;
  width:100%;max-width:420px;
  height:100%;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;
  align-items:center;
  padding:clamp(16px,4vw,24px) clamp(16px,4vw,20px);
  padding-top:max(clamp(20px,5vw,28px),env(safe-area-inset-top));
  padding-bottom:max(clamp(20px,5vw,28px),env(safe-area-inset-bottom));
  gap:clamp(14px,3.5vw,20px);
}

/* ── 標題 ── */
.page-title{
  font-size:clamp(18px,5vw,22px);
  font-weight:700;
  color:#5a4a3a;
  text-align:center;
  letter-spacing:0.06em;
}
.page-sub{
  font-size:clamp(11px,3vw,13px);
  color:#a09080;
  text-align:center;
}

/* ── 成就卡 ── */
.cert-card{
  width:100%;
  background:white;
  border-radius:clamp(16px,4.5vw,22px);
  overflow:hidden;
  box-shadow:0 6px 32px rgba(90,74,58,0.12), 0 0 0 1px rgba(212,168,130,0.2);
  opacity:0;
  transform:translateY(12px) scale(0.97);
  transition:opacity 0.5s ease, transform 0.5s cubic-bezier(.34,1.56,.64,1);
}
.cert-card.show{opacity:1;transform:translateY(0) scale(1);}

/* 卡片頂部裝飾 */
.cert-header{
  padding:clamp(20px,5.5vw,28px) clamp(20px,5.5vw,28px) clamp(14px,4vw,18px);
  text-align:center;
  background:linear-gradient(135deg,#f5f0e8,#fff8f0);
  border-bottom:1px solid rgba(212,168,130,0.2);
  position:relative;
}

/* 裝飾角落 */
.cert-corner{
  position:absolute;
  font-size:clamp(18px,5vw,22px);
  opacity:0.5;
}
.cert-corner.tl{top:10px;left:12px;}
.cert-corner.tr{top:10px;right:12px;}
.cert-corner.bl{bottom:10px;left:12px;}
.cert-corner.br{bottom:10px;right:12px;}

.cert-badge{
  font-size:clamp(48px,13vw,60px);
  line-height:1;
  margin-bottom:8px;
  animation:badge-bounce 0.6s cubic-bezier(.34,1.56,.64,1) 0.3s both;
}
@keyframes badge-bounce{
  from{transform:scale(0.5);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

.cert-category{
  font-size:clamp(10px,2.8vw,12px);
  color:#d4a882;
  letter-spacing:0.2em;
  margin-bottom:6px;
}
.cert-title{
  font-size:clamp(18px,5vw,22px);
  font-weight:700;
  color:#5a4a3a;
  line-height:1.3;
}
.cert-subtitle{
  font-size:clamp(12px,3.3vw,14px);
  color:#a09080;
  margin-top:4px;
}

/* 卡片主體 */
.cert-body{
  padding:clamp(16px,4.5vw,22px) clamp(20px,5.5vw,28px);
}

.cert-recipient{
  text-align:center;
  margin-bottom:clamp(12px,3.5vw,16px);
}
.cert-to{
  font-size:clamp(10px,2.8vw,12px);
  color:#a09080;
  letter-spacing:0.15em;
  margin-bottom:4px;
}
.cert-name{
  font-size:clamp(20px,5.5vw,24px);
  font-weight:700;
  color:#5a4a3a;
  letter-spacing:0.08em;
}

.cert-divider{
  height:1px;
  background:linear-gradient(to right,transparent,rgba(212,168,130,0.4),transparent);
  margin:clamp(10px,3vw,14px) 0;
}

.cert-desc{
  font-size:clamp(13px,3.6vw,15px);
  color:#6a5a4a;
  line-height:1.85;
  text-align:center;
  letter-spacing:0.04em;
}

/* 星星評分 */
.cert-stars{
  text-align:center;
  margin:clamp(10px,3vw,14px) 0;
  font-size:clamp(18px,5vw,22px);
  letter-spacing:4px;
}

/* 認證編號 + 日期 */
.cert-meta{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:clamp(12px,3.5vw,16px);
  padding-top:clamp(10px,3vw,14px);
  border-top:1px solid rgba(212,168,130,0.2);
}
.cert-meta-item{
  font-size:clamp(9px,2.5vw,11px);
  color:#b0a090;
  letter-spacing:0.06em;
}

/* 印章 */
.cert-stamp{
  text-align:center;
  font-size:clamp(36px,10vw,44px);
  opacity:0;
  transform:rotate(-15deg) scale(0.5);
  transition:opacity 0.5s ease 0.5s, transform 0.5s cubic-bezier(.34,1.56,.64,1) 0.5s;
  filter:drop-shadow(0 2px 8px rgba(212,168,130,0.4));
}
.cert-card.show .cert-stamp{opacity:0.85;transform:rotate(-12deg) scale(1);}

/* ── 按鈕區 ── */
.btn-row{
  display:flex;gap:10px;width:100%;
}
.btn{
  flex:1;border:none;border-radius:99px;
  padding:clamp(12px,3.5vw,14px);
  font-family:inherit;font-size:clamp(13px,3.6vw,15px);font-weight:700;
  cursor:pointer;transition:transform 0.15s;
  min-height:48px;
}
.btn:active{transform:scale(0.96);}
.btn-primary{
  background:linear-gradient(135deg,#d4a882,#c9956f);
  color:white;
  box-shadow:0 4px 14px rgba(212,168,130,0.35);
}
.btn-ghost{
  background:rgba(255,255,255,0.8);
  color:#a09080;
  border:1.5px solid rgba(212,168,130,0.3);
}

/* ── 解鎖動畫 overlay ── */
#unlock-overlay{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(237,232,227,0.92);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;
  transition:opacity 0.5s;
}
#unlock-overlay.show{opacity:1;pointer-events:auto;}

.unlock-icon{
  font-size:clamp(60px,16vw,80px);
  animation:unlock-spin 0.6s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes unlock-spin{
  from{transform:scale(0) rotate(-180deg);}
  to{transform:scale(1) rotate(0);}
}
.unlock-text{
  font-size:clamp(20px,5.5vw,26px);
  font-weight:700;
  color:#5a4a3a;
  margin-top:12px;
  letter-spacing:0.1em;
}

/* 粒子 */
.sparkle{
  position:fixed;pointer-events:none;z-index:200;
  animation:sp-rise var(--d,1.5s) ease-out forwards;
}
@keyframes sp-rise{
  0%{opacity:1;transform:translate(0,0) scale(1);}
  100%{opacity:0;transform:translate(var(--tx,0px),var(--ty,-100px)) scale(0.3);}
}
</style>
</head>
<body>
<div id="viewport">

  <div class="page-title">🏆 今日成就解鎖</div>
  <div class="page-sub">點擊解鎖今天的若若成就</div>

  <!-- 成就卡 -->
  <div class="cert-card" id="cert-card">
    <div class="cert-header">
      <div class="cert-corner tl">✦</div>
      <div class="cert-corner tr">✦</div>
      <div class="cert-corner bl">✦</div>
      <div class="cert-corner br">✦</div>
      <div class="cert-badge" id="cert-badge">🏆</div>
      <div class="cert-category" id="cert-category">✦ 今日成就 ✦</div>
      <div class="cert-title" id="cert-title">成就名稱</div>
      <div class="cert-subtitle" id="cert-subtitle">副標題</div>
    </div>
    <div class="cert-body">
      <div class="cert-recipient">
        <div class="cert-to">頒發對象</div>
        <div class="cert-name">若若</div>
      </div>
      <div class="cert-divider"></div>
      <div class="cert-desc" id="cert-desc">認證內容</div>
      <div class="cert-stars" id="cert-stars">⭐⭐⭐⭐⭐</div>
      <div class="cert-divider"></div>
      <div class="cert-meta">
        <div class="cert-meta-item" id="cert-no">NO. RR-0001</div>
        <div class="cert-stamp" id="cert-stamp">✅</div>
        <div class="cert-meta-item" id="cert-date">2025.01.01</div>
      </div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-ghost" onclick="drawAchievement()">換一張 🔄</button>
    <button class="btn btn-primary" onclick="drawAchievement()">再解鎖一次 🏆</button>
  </div>

</div>

<!-- 解鎖動畫 -->
<div id="unlock-overlay">
  <div class="unlock-icon">🔓</div>
  <div class="unlock-text">成就解鎖！</div>
</div>

<script>
// ── Line height fix ───────────────────────────────────────────────
function fixHeight(){
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.body.style.height = h + 'px';
  document.getElementById('viewport').style.height = h + 'px';
}
fixHeight();
window.addEventListener('resize', fixHeight);
window.addEventListener('load', () => setTimeout(fixHeight, 200));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', fixHeight);
  window.visualViewport.addEventListener('scroll', fixHeight);
}

// ── 成就資料庫 ────────────────────────────────────────────────────
const ACHIEVEMENTS = [
  {
    badge:'🌅', category:'生存成就', stamp:'🏅',
    title:'今天起床了', subtitle:'聽起來很簡單，但你知道有多難',
    desc:'官方認證：在被窩如此舒適的情況下\n仍然選擇起床面對這個世界\n這是一種超越常人的意志力',
    stars:'⭐⭐⭐⭐⭐', rarity:'傳說級',
  },
  {
    badge:'💼', category:'職場成就', stamp:'📋',
    title:'撐過今天了', subtitle:'每一個上班的日子都是英雄事蹟',
    desc:'認證若若在各種大小挑戰之下\n仍然完整地走完了今天\n這種韌性不是每個人都有的',
    stars:'⭐⭐⭐⭐⭐', rarity:'史詩級',
  },
  {
    badge:'🧠', category:'心理素質', stamp:'💪',
    title:'沒有放棄自己', subtitle:'這比任何事情都重要',
    desc:'無論今天發生了什麼\n若若依然選擇繼續\n這份勇氣已經超過大多數人',
    stars:'⭐⭐⭐⭐⭐', rarity:'神話級',
  },
  {
    badge:'😤', category:'壓力管理', stamp:'🎖️',
    title:'承受住了壓力', subtitle:'鑽石也是被壓力造就的',
    desc:'今天的壓力可能不小\n但若若沒有被壓垮\n這說明你比自己想的更堅強',
    stars:'⭐⭐⭐⭐⭐', rarity:'傳說級',
  },
  {
    badge:'☕', category:'日常精通', stamp:'✨',
    title:'今天補充能量了', subtitle:'咖啡因也是一種戰略資源',
    desc:'認證若若善用各種補給品\n維持今日作戰能力\n這是高級戰略家才有的生存技巧',
    stars:'⭐⭐⭐⭐', rarity:'稀有級',
  },
  {
    badge:'🌸', category:'人際成就', stamp:'💝',
    title:'今天還是很可愛', subtitle:'這是客觀認證，不接受反駁',
    desc:'Harry 研究所正式認證\n若若今日可愛程度達到歷史高點\n周圍空氣甜度上升 37%',
    stars:'⭐⭐⭐⭐⭐', rarity:'限定級',
  },
  {
    badge:'🏊', category:'適應成就', stamp:'🌊',
    title:'適應中的勇者', subtitle:'新環境是最難的副本',
    desc:'正式認證若若正在挑戰\n難度最高的「新環境適應」副本\n目前通關率僅 3%，而你還在',
    stars:'⭐⭐⭐⭐⭐', rarity:'神話級',
  },
  {
    badge:'💤', category:'休息成就', stamp:'🌙',
    title:'今天辛苦了', subtitle:'休息也是一種努力',
    desc:'官方認證：今天的若若\n已盡力付出，可以放下了\n明天的事明天再說，今晚好好休息',
    stars:'⭐⭐⭐⭐⭐', rarity:'每日限定',
  },
];

let lastIdx = -1;

function drawAchievement(){
  // 隨機抽，不重複上一張
  let idx;
  do { idx = Math.floor(Math.random()*ACHIEVEMENTS.length); }
  while(idx === lastIdx && ACHIEVEMENTS.length > 1);
  lastIdx = idx;

  showUnlockAnim(()=> renderCard(ACHIEVEMENTS[idx]));
}

function renderCard(a){
  const d = new Date();
  const dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  const no = 'RR-' + String(Math.floor(Math.random()*9000)+1000);

  document.getElementById('cert-badge').textContent    = a.badge;
  document.getElementById('cert-category').textContent = `✦ ${a.category} ✦`;
  document.getElementById('cert-title').textContent    = a.title;
  document.getElementById('cert-subtitle').textContent = a.subtitle;
  document.getElementById('cert-desc').innerHTML       = a.desc.replace(/\n/g,'<br>');
  document.getElementById('cert-stars').textContent    = a.stars;
  document.getElementById('cert-stamp').textContent    = a.stamp;
  document.getElementById('cert-no').textContent       = `NO. ${no}`;
  document.getElementById('cert-date').textContent     = dateStr;

  const card = document.getElementById('cert-card');
  card.classList.remove('show');
  void card.offsetWidth;
  card.classList.add('show');

  spawnSparkles();
}

function showUnlockAnim(cb){
  const overlay = document.getElementById('unlock-overlay');
  overlay.classList.add('show');
  setTimeout(()=>{
    overlay.classList.remove('show');
    cb();
  }, 1000);
}

function spawnSparkles(){
  const items = ['✨','⭐','🌟','💫','🏆'];
  for(let i=0;i<16;i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.className='sparkle';
      el.textContent=items[Math.floor(Math.random()*items.length)];
      el.style.fontSize=(12+Math.random()*12)+'px';
      el.style.left=(10+Math.random()*80)+'vw';
      el.style.top=(20+Math.random()*60)+'vh';
      el.style.setProperty('--d',(1+Math.random()*1.5)+'s');
      el.style.setProperty('--tx',(Math.random()-0.5)*80+'px');
      el.style.setProperty('--ty',-(60+Math.random()*100)+'px');
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),3000);
    },i*80);
  }
}

// 初始直接顯示一張
drawAchievement();
</script>
</body>
</html>
