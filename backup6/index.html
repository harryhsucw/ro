<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>今日心情診斷 💊</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}

:root{
  --bg:#ede8e3;--sand:#d4a882;--blue:#4a9cc7;
  --text:#5a4a3a;--text-light:#a09080;--white:#fff;
  --doc-border:#c8b89a;
}

html{height:100%;overflow:hidden;position:fixed;width:100%;}
body{
  height:100%;width:100%;overflow:hidden;
  background:var(--bg);
  font-family:'Zen Maru Gothic','PingFang TC','Apple Color Emoji',sans-serif;
  color:var(--text);
  display:flex;flex-direction:column;align-items:center;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

.bg-blob{position:fixed;border-radius:50%;filter:blur(50px);opacity:0.3;pointer-events:none;z-index:0;}
.b1{width:240px;height:240px;top:-60px;right:-60px;background:#f5c6d0;}
.b2{width:180px;height:180px;bottom:160px;left:-50px;background:#b4d4f5;}

#scroll-wrap{
  position:relative;z-index:1;
  width:100%;max-width:420px;
  height:100%;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;
  padding:clamp(14px,4vw,20px) clamp(14px,4vw,18px);
  padding-top:max(clamp(14px,4vw,20px),env(safe-area-inset-top));
  padding-bottom:max(clamp(16px,4vw,20px),env(safe-area-inset-bottom));
  gap:clamp(10px,3vw,14px);
}

.page-header{text-align:center;flex-shrink:0;}
.page-title{font-size:clamp(18px,5vw,22px);font-weight:700;}
.page-sub{font-size:clamp(11px,3vw,13px);color:var(--text-light);margin-top:3px;line-height:1.5;}

.doctor-badge{
  display:flex;align-items:center;gap:10px;
  background:var(--white);border-radius:clamp(12px,3.5vw,16px);
  padding:clamp(10px,3vw,14px) clamp(12px,3.5vw,16px);
  box-shadow:0 4px 16px rgba(90,74,58,0.08);flex-shrink:0;
}
.doctor-avatar{font-size:clamp(30px,8.5vw,38px);line-height:1;}
.doctor-name{font-size:clamp(13px,3.8vw,15px);font-weight:700;}
.doctor-title{font-size:clamp(10px,2.8vw,12px);color:var(--text-light);}

.input-card{
  background:var(--white);border-radius:clamp(14px,4vw,18px);
  padding:clamp(14px,4vw,18px);
  box-shadow:0 4px 16px rgba(90,74,58,0.08);flex-shrink:0;
}
.input-label{font-size:clamp(12px,3.3vw,14px);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}

textarea{user-select:text;-webkit-user-select:text;touch-action:auto;}

.mood-textarea{
  width:100%;border:1.5px solid rgba(200,184,154,0.5);
  border-radius:clamp(10px,3vw,12px);
  padding:clamp(10px,3vw,13px);
  font-family:'Zen Maru Gothic','PingFang TC',sans-serif;
  font-size:clamp(14px,4vw,16px);color:var(--text);
  background:#faf8f5;resize:none;outline:none;
  min-height:clamp(100px,28vw,130px);line-height:1.7;
  transition:border-color 0.2s,box-shadow 0.2s;
}
.mood-textarea:focus{border-color:var(--sand);box-shadow:0 0 0 3px rgba(212,168,130,0.15);}
.mood-textarea::placeholder{color:var(--text-light);}
.char-count{text-align:right;font-size:clamp(10px,2.8vw,11px);color:var(--text-light);margin-top:5px;}

.btn-submit{
  width:100%;border:none;border-radius:99px;
  padding:clamp(13px,3.5vw,15px);
  font-family:inherit;font-size:clamp(14px,4vw,16px);font-weight:700;
  background:linear-gradient(135deg,var(--sand),#c9956f);color:white;
  cursor:pointer;box-shadow:0 4px 16px rgba(212,168,130,0.35);
  transition:transform 0.15s,opacity 0.2s;
  opacity:0.4;pointer-events:none;flex-shrink:0;
}
.btn-submit.ready{opacity:1;pointer-events:auto;}
.btn-submit:active{transform:scale(0.97);}

/* loading */
#screen-loading{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;text-align:center;flex:1;min-height:200px;
}
.loading-avatar{font-size:clamp(48px,13vw,60px);animation:doctor-think 1.4s ease-in-out infinite;}
@keyframes doctor-think{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-8px) rotate(3deg);}}
.loading-text{font-size:clamp(14px,4vw,16px);font-weight:700;}
.loading-sub{font-size:clamp(11px,3vw,13px);color:var(--text-light);}
.loading-dots span{animation:blink 1.2s infinite;display:inline-block;}
.loading-dots span:nth-child(2){animation-delay:0.2s;}
.loading-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes blink{0%,80%,100%{opacity:0;}40%{opacity:1;}}

/* report */
#screen-report{display:none;flex-direction:column;gap:clamp(10px,3vw,14px);}

.doc-paper{
  background:var(--white);border-radius:clamp(14px,4vw,18px);
  overflow:hidden;box-shadow:0 6px 24px rgba(90,74,58,0.10);
  border:1.5px solid var(--doc-border);
}
.doc-header{background:linear-gradient(135deg,#4a6fa0,#3a5f90);padding:clamp(12px,3.5vw,16px) clamp(14px,4vw,18px);color:white;}
.doc-hospital{font-size:clamp(9px,2.5vw,11px);letter-spacing:0.15em;opacity:0.8;margin-bottom:2px;}
.doc-title-big{font-size:clamp(15px,4.5vw,18px);font-weight:700;letter-spacing:0.05em;}
.doc-title-en{font-size:clamp(9px,2.3vw,10px);opacity:0.6;letter-spacing:0.1em;margin-top:1px;}

.doc-meta{display:grid;grid-template-columns:1fr 1fr;border-bottom:1.5px solid rgba(200,184,154,0.4);font-size:clamp(10px,2.8vw,12px);}
.doc-meta-item{padding:clamp(7px,2.2vw,10px) clamp(10px,3vw,14px);border-right:1px solid rgba(200,184,154,0.3);}
.doc-meta-item:nth-child(even){border-right:none;}
.meta-label{color:var(--text-light);font-size:clamp(9px,2.3vw,10px);margin-bottom:1px;}
.meta-value{color:var(--text);font-weight:500;}

.doc-body{padding:clamp(10px,3vw,14px) clamp(12px,3.5vw,16px);display:flex;flex-direction:column;gap:clamp(8px,2.5vw,12px);}
.doc-section-label{font-size:clamp(9px,2.4vw,11px);color:var(--blue);letter-spacing:0.12em;font-weight:700;border-bottom:1px solid rgba(74,156,199,0.2);padding-bottom:3px;margin-bottom:6px;}
.doc-section-content{font-size:clamp(12px,3.3vw,13px);color:var(--text);line-height:1.75;}

.index-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.index-label{font-size:clamp(10px,2.8vw,12px);color:var(--text-light);width:clamp(60px,17vw,76px);flex-shrink:0;}
.index-bar{flex:1;height:7px;background:rgba(90,74,58,0.08);border-radius:99px;overflow:hidden;}
.index-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sand),#f2a7b8);width:0%;transition:width 0.9s cubic-bezier(.34,1.56,.64,1) 0.2s;}
.index-val{font-size:clamp(10px,2.8vw,12px);font-weight:700;color:var(--text);width:28px;text-align:right;}

.rx-item{
  display:flex;align-items:flex-start;gap:8px;
  font-size:clamp(11px,3.1vw,13px);color:var(--text);line-height:1.55;
  padding:clamp(6px,2vw,8px) clamp(8px,2.5vw,10px);
  background:rgba(74,156,199,0.06);border-radius:8px;
  border-left:3px solid var(--blue);margin-bottom:5px;
}
.rx-num{color:var(--blue);font-weight:700;flex-shrink:0;padding-top:1px;}

.doc-footer{border-top:1.5px solid rgba(200,184,154,0.4);padding:clamp(8px,2.5vw,12px) clamp(12px,3.5vw,16px);display:flex;align-items:center;justify-content:space-between;}
.doc-stamp{font-size:clamp(28px,8vw,36px);opacity:0.85;transform:rotate(-8deg);}
.doc-sign-line{font-size:clamp(14px,4.2vw,17px);color:var(--blue);font-style:italic;border-bottom:1px solid var(--doc-border);padding-bottom:2px;margin-bottom:3px;}
.doc-sign-label{font-size:clamp(9px,2.3vw,10px);color:var(--text-light);text-align:right;}

.btn-row{display:flex;gap:8px;flex-shrink:0;}
.btn{flex:1;border:none;border-radius:99px;padding:clamp(11px,3vw,13px);font-family:inherit;font-size:clamp(12px,3.4vw,14px);font-weight:700;cursor:pointer;transition:transform 0.15s;min-height:44px;}
.btn:active{transform:scale(0.96);}
.btn-primary{background:linear-gradient(135deg,var(--sand),#c9956f);color:white;box-shadow:0 4px 14px rgba(212,168,130,0.3);}
.btn-ghost{background:rgba(255,255,255,0.7);color:var(--text-light);border:1.5px solid rgba(90,74,58,0.12);}
</style>
</head>
<body>

<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>

<div id="scroll-wrap">

  <div id="screen-input" style="display:contents">
    <div class="page-header">
      <div class="page-title">💊 今日心情診斷</div>
      <div class="page-sub">告訴 Harry 醫師你今天的心情<br>他會幫你出一份專屬診斷書</div>
    </div>

    <div class="doctor-badge">
      <div class="doctor-avatar">👨‍⚕️</div>
      <div>
        <div class="doctor-name">Harry 醫師</div>
        <div class="doctor-title">若若幸福研究所・首席診斷醫師・現正問診中</div>
      </div>
    </div>

    <div class="input-card">
      <div class="input-label">📋 今天心情怎麼樣？</div>
      <textarea class="mood-textarea" id="mood-input"
        placeholder="例如：今天上班有點累，但下午喝了好喝的咖啡，整個人好一點了。還有同事給我看很可愛的狗狗影片…"
        maxlength="200" oninput="onInputChange()"></textarea>
      <div class="char-count"><span id="char-now">0</span> / 200</div>
    </div>

    <button class="btn-submit" id="btn-submit" onclick="submitMood()">🩺 出具診斷書</button>
  </div>

  <div id="screen-loading">
    <div class="loading-avatar">👨‍⚕️</div>
    <div class="loading-text">Harry 醫師診斷中<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></div>
    <div class="loading-sub" id="loading-sub">認真翻閱若若病歷中</div>
  </div>

  <div id="screen-report">
    <div class="doctor-badge">
      <div class="doctor-avatar">👨‍⚕️</div>
      <div>
        <div class="doctor-name">Harry 醫師</div>
        <div class="doctor-title">若若幸福研究所・首席診斷醫師</div>
      </div>
    </div>

    <div class="doc-paper">
      <div class="doc-header">
        <div class="doc-hospital">若若幸福研究所・門診部</div>
        <div class="doc-title-big">今日心情診斷書</div>
        <div class="doc-title-en">DAILY MOOD DIAGNOSIS REPORT</div>
      </div>
      <div class="doc-meta">
        <div class="doc-meta-item"><div class="meta-label">患者</div><div class="meta-value">若若</div></div>
        <div class="doc-meta-item"><div class="meta-label">診斷日期</div><div class="meta-value" id="r-date">—</div></div>
        <div class="doc-meta-item"><div class="meta-label">主訴心情</div><div class="meta-value" id="r-mood">—</div></div>
        <div class="doc-meta-item"><div class="meta-label">診斷碼</div><div class="meta-value" id="r-code">—</div></div>
      </div>
      <div class="doc-body">
        <div class="doc-section">
          <div class="doc-section-label">▸ 臨床診斷</div>
          <div class="doc-section-content" id="r-diagnosis">—</div>
        </div>
        <div class="doc-section">
          <div class="doc-section-label">▸ 各項幸福指數</div>
          <div id="r-indices"></div>
        </div>
        <div class="doc-section">
          <div class="doc-section-label">▸ 醫師處方</div>
          <div id="r-rx"></div>
        </div>
      </div>
      <div class="doc-footer">
        <div class="doc-stamp" id="r-stamp">✅</div>
        <div>
          <div class="doc-sign-line">Harry, MD</div>
          <div class="doc-sign-label">若若幸福研究所・主治醫師</div>
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goBack()">← 重新填寫</button>
      <button class="btn btn-primary" onclick="goBack()">💊 收下囉！</button>
    </div>
  </div>

</div>

<script>
// ── Line browser height fix ───────────────────────────────────────
function fixHeight() {
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.getElementById('scroll-wrap').style.minHeight = h + 'px';
}
fixHeight();
window.addEventListener('resize', fixHeight);
window.addEventListener('load', () => setTimeout(fixHeight, 200));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fixHeight);
}

// ── Input ─────────────────────────────────────────────────────────
function onInputChange() {
  const v = document.getElementById('mood-input').value;
  document.getElementById('char-now').textContent = v.length;
  document.getElementById('btn-submit').classList.toggle('ready', v.trim().length >= 5);
}

// ══════════════════════════════════════════════════════════════════
// 診斷引擎：關鍵字偵測 + 組合生成
// ══════════════════════════════════════════════════════════════════

// ── 關鍵字字典 ────────────────────────────────────────────────────
const KEYWORDS = {
  tired:   ['累','疲','睏','沒力','沒精神','想睡','睡不夠','好累','超累','很累','乏力'],
  happy:   ['開心','快樂','高興','幸福','爽','棒','讚','好玩','太好了','超棒','很棒','喜歡','愛','😊','🥰','😄'],
  sad:     ['難過','傷心','哭','低落','沮喪','不開心','心情不好','失落','憂鬱','很差','😢','😭'],
  angry:   ['煩','生氣','憤怒','火大','討厭','爛','幹','不爽','氣死','氣到','很煩','超煩'],
  anxious: ['焦慮','緊張','壓力','擔心','害怕','不安','慌','怕','壓力大','很多事'],
  coffee:  ['咖啡','拿鐵','美式','卡布','cappuccino','latte','西西里'],
  food:    ['吃','喝','飯','食物','餐','蛋糕','甜點','點心','下午茶','奶茶','珍珠'],
  work:    ['上班','工作','加班','客戶','開會','報告','老闆','同事','任務','專案','辦公'],
  cute:    ['可愛','萌','貓','狗','動物','寵物','毛小孩','療癒'],
  excited: ['期待','興奮','等不及','好期待','超期待','迫不及待'],
  bored:   ['無聊','沒事做','閒','空虛','無感','普通','還好','一般'],
};

// ── 情緒偵測 ──────────────────────────────────────────────────────
function detectEmotions(text) {
  const found = {};
  for (const [emotion, words] of Object.entries(KEYWORDS)) {
    found[emotion] = words.some(w => text.includes(w));
  }
  return found;
}

// ── 隨機取一個 ───────────────────────────────────────────────────
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function pickN(arr, n) {
  const shuffled = [...arr].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

// ── 診斷資料庫 ────────────────────────────────────────────────────
const DB = {
  // 主要情緒 → 診斷碼 / emoji / 短摘要 / 診斷文
  moods: {
    happy: {
      codes:   ['HPY-001','HPY-042','HPY-088','JOY-007'],
      emojis:  ['😊','🌟','💕','🥰'],
      shorts:  ['超開心','心情很好','幸福滿載','開心爆表'],
      stamps:  ['🌟','✨','💖','🌈'],
      diagnoses: [
        '患者呈現顯著愉悅症候群，伴隨自發性嘴角上揚及輕度跳躍衝動。此為高度健康狀態，Harry 醫師建議保持並對外傳播。',
        '經診斷，患者今日幸福指數異常充盈，各項快樂因子均在標準值以上。此症狀具有傳染性，請勿刻意壓制。',
        '患者出現急性幸福爆發症，病因為多重正向刺激同時作用。Harry 醫師確認：繼續這樣就對了。',
      ],
    },
    sad: {
      codes:   ['SAD-005','BLU-013','LWM-021'],
      emojis:  ['😢','🌧️','💙'],
      shorts:  ['有點難過','心情低落','軟軟的','有點藍'],
      stamps:  ['🫶','💙','🌿'],
      diagnoses: [
        '患者出現心情偏低狀態，伴隨輕度需要被關心症候群。Harry 醫師確認：難過是 OK 的，你不需要立刻好起來。',
        '診斷顯示患者今日情緒能量偏低，屬正常人類波動。建議接受來自 Harry 的遠端關心處方，效果顯著。',
        '患者呈現輕度藍色心情綜合症，伴隨輕微需要被抱抱衝動。此為可治療狀態，Harry 醫師已備妥處方。',
      ],
    },
    tired: {
      codes:   ['TRD-003','EXH-017','ZZZ-099'],
      emojis:  ['😴','🔋','💤'],
      shorts:  ['有點累','電量不足','需要充電','累累的'],
      stamps:  ['💤','🛌','☕️'],
      diagnoses: [
        '患者出現輕度能量不足症，伴隨眼皮沉重感及頻繁呵欠衝動。此為可治療狀態，咖啡因補充為第一線療法。',
        '診斷確認患者今日電量剩餘偏低，建議立即進入充電模式。Harry 醫師特別備註：摸魚比例可提升至 40%。',

      ],
    },
    angry: {
      codes:   ['FRT-004','IRR-028','GRR-056'],
      emojis:  ['😤','🌋','💢'],
      shorts:  ['有點煩','情緒不穩','火氣有點大','心情浮動'],
      stamps:  ['🫁','💨','🌬️'],
      diagnoses: [
        '患者呈現輕度煩躁綜合症，病因多為外部干擾源或不合理要求。此為正常人類防衛反應，Harry 醫師表示理解。',
        '診斷顯示患者今日忍耐槽偏低，各種外部刺激均可能引發超標反應。建議物理隔離所有煩躁來源。',
        '患者出現急性不爽症，伴隨低聲嘆氣及眉間皺紋加深。Harry 醫師確認：你有資格煩，這不是你的問題。',
      ],
    },
    anxious: {
      codes:   ['ANX-011','WRY-033','PRE-044'],
      emojis:  ['😰','🌀','😟'],
      shorts:  ['有點焦慮','壓力有點大','擔心中','心情緊繃'],
      stamps:  ['🫧','🌿','💭'],
      diagnoses: [
        '患者出現輕度焦慮症候群，伴隨思緒過度活躍及輕微坐立不安。Harry 醫師確認：你想太多了，先深呼吸。',
        '診斷顯示患者今日壓力指數偏高，大腦正在過度運轉中。建議立即啟動「先不管它」模式。',
        '患者呈現壓力累積症，多重待辦事項同時觸發警報。Harry 醫師處方：一次只做一件事，其他的等一下再說。',
      ],
    },

// ── 主判斷邏輯 ────────────────────────────────────────────────────
function diagnose(text) {
  const e = detectEmotions(text);

  // 決定主情緒（優先順序）
  let mainMood = 'bored';
  if (e.sad)     mainMood = 'sad';
  if (e.tired)   mainMood = 'tired';
  if (e.anxious) mainMood = 'anxious';
  if (e.angry)   mainMood = 'angry';
  if (e.excited) mainMood = 'excited';
  if (e.happy)   mainMood = 'happy';
  // 如果同時有 happy + tired，根據哪個更多
  if (e.happy && e.tired) {
    const happyCount = KEYWORDS.happy.filter(w => text.includes(w)).length;
    const tiredCount = KEYWORDS.tired.filter(w => text.includes(w)).length;
    mainMood = happyCount >= tiredCount ? 'happy' : 'tired';
  }

  const m = DB.moods[mainMood];
  const [idxNames, idxBaseVals] = DB.indexNames[mainMood];
  const rxList = [...DB.rxPool[mainMood]];

  // 加入特殊處方
  const bonusRxList = [];
  for (const [key, rx] of Object.entries(DB.bonusRx)) {
    if (e[key]) bonusRxList.push(rx);
  }

  // 組合指數（加上隨機浮動 ±8）
  const indices = idxNames.map((name, i) => ({
    name,
    value: Math.min(100, Math.max(5, idxBaseVals[i] + rand(-8, 8))),
  }));

  // 處方：取3條 + 最多1條特殊
  const finalRx = pickN(rxList, 3);
  if (bonusRxList.length) finalRx.push(pick(bonusRxList));

  return {
    mood_emoji: pick(m.emojis),
    mood_short: pick(m.shorts),
    code:       pick(m.codes),
    stamp:      pick(m.stamps),
    diagnosis:  pick(m.diagnoses),
    indices,
    rx: finalRx,
  };
}

  ]

處方要具體可執行，有時可以包含 Harry 本人（例如「立即索取 Harry 抱抱一個」）。`;

  try {
    const resp = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: 'user', content: `若若今日心情描述：${input}` }],
      }),

    const data = await resp.json();
    console.log('[Worker 回傳]', JSON.stringify(data));

    const raw = data.content?.[0]?.text || '';

    const cleaned = raw.replace(/```json|```/g, '').trim();

function renderReport(r, dateStr) {
  document.getElementById('r-date').textContent  = dateStr;
  document.getElementById('r-mood').textContent  = r.mood_emoji + ' ' + r.mood_short;
  document.getElementById('r-code').textContent  = r.code;
  document.getElementById('r-stamp').textContent = r.stamp;
  document.getElementById('r-diagnosis').textContent = r.diagnosis;

  const indicesEl = document.getElementById('r-indices');
  indicesEl.innerHTML = '';
  r.indices.forEach(idx => {
    const row = document.createElement('div');
    row.className = 'index-row';
    row.innerHTML = `
      <div class="index-label">${idx.name}</div>
      <div class="index-bar"><div class="index-fill" data-val="${idx.value}"></div></div>
      <div class="index-val">${idx.value}</div>`;
    indicesEl.appendChild(row);
  });

  const rxEl = document.getElementById('r-rx');
  rxEl.innerHTML = '';
  r.rx.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'rx-item';
    el.innerHTML = `<span class="rx-num">Rx${i+1}</span><span>${item}</span>`;
    rxEl.appendChild(el);
  });

  setScreen('report');

  setTimeout(() => {
    document.querySelectorAll('.index-fill').forEach(bar => {
      bar.style.width = bar.dataset.val + '%';
    });
  }, 120);
}

function setScreen(name) {
  document.getElementById('screen-input').style.display   = name === 'input'   ? 'contents' : 'none';
  document.getElementById('screen-loading').style.display = name === 'loading' ? 'flex'     : 'none';
  document.getElementById('screen-report').style.display  = name === 'report'  ? 'flex'     : 'none';
  document.getElementById('scroll-wrap').scrollTop = 0;
}

function goBack() {
  clearInterval(loadingTimer);
  document.getElementById('mood-input').value = '';
  document.getElementById('char-now').textContent = '0';
  document.getElementById('btn-submit').classList.remove('ready');
  setScreen('input');
}
