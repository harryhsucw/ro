<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天的若若依舊美麗</title>
    <style>
        /* 基礎樣式設定 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f7f3ed;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 內容容器 */
        .container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 預設隱藏的類別 */
        .hidden {
            display: none !important;
        }

        /* ================= 共通圖片樣式 ================= */
        .girl-img {
            width: 80%;
            max-width: 320px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            object-fit: cover;
        }

        /* ================= 階段 1：Landing Page ================= */
        #landing-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .action-btn {
            background-color: #e5ba9e;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(229, 186, 158, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .action-btn:hover {
            background-color: #d4a78b;
            transform: scale(1.05);
        }

        /* ================= 階段 2：洗澡中 ================= */
        #shower-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
        }

        /* 進度條 */
        .progress-container {
            width: 70%;
            background-color: rgba(255,255,255,0.5);
            border-radius: 10px;
            margin-top: 10px;
            padding: 3px;
        }

        .progress-bar {
            width: 0%;
            height: 15px;
            background-color: #4db6ac;
            border-radius: 8px;
            transition: width 0.1s linear;
        }

        .status-text {
            margin-top: 15px;
            color: #004d40;
            font-weight: bold;
        }

        /* ================= 階段 3：完成與禮物 ================= */
        #result-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            width: 100%;
        }

        /* 禮物盒區域 */
        .gifts-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 25px;
        }

        .gift-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .gift-box:hover {
            transform: scale(1.1);
        }

        .gift-icon {
            font-size: 50px;
            margin-bottom: 5px;
        }

        /* 彈出視窗（顯示禮物內容） */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: popUp 0.3s ease-out;
            max-width: 80%;
        }

        @keyframes popUp {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            margin-top: 20px;
            background-color: #e5ba9e;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">

        <div id="landing-page">
            <img class="girl-img" src="beforeshower.png" alt="洗澡前的若若">
            <button class="action-btn" id="start-btn">洗澡去囉～</button>
        </div>

        <div id="shower-page" class="hidden">
            <img class="girl-img" src="shower.png" alt="若若洗澡中">
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="status-text">若若洗澡中，請稍候...</div>
        </div>

        <div id="result-page" class="hidden">
            <img class="girl-img" src="aftershower.png" alt="洗完澡的若若">
            
            <div class="gifts-container">
                <div class="gift-box" onclick="openGift('成功獲得六月業績獎金 💰')">
                    <div class="gift-icon">🎁</div>
                    <span>禮物一</span>
                </div>
                <div class="gift-box" onclick="openGift('西西里咖啡乙杯 ☕')">
                    <div class="gift-icon">🎁</div>
                    <span>禮物二</span>
                </div>
                <div class="gift-box" onclick="openGift('一覺好眠，夢到美食樂園 🎡')">
                    <div class="gift-icon">🎁</div>
                    <span>禮物三</span>
                </div>
            </div>
        </div>

        <div id="gift-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="gift-text">禮物內容</h2>
                <button class="close-btn" onclick="closeModal()">收下禮物</button>
            </div>
        </div>

    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const landingPage = document.getElementById('landing-page');
        const showerPage = document.getElementById('shower-page');
        const resultPage = document.getElementById('result-page');
        const progressBar = document.getElementById('progress-bar');
        const giftModal = document.getElementById('gift-modal');
        const giftText = document.getElementById('gift-text');

        // 點擊「洗澡去囉～」按鈕
        startBtn.addEventListener('click', () => {
            landingPage.classList.add('hidden');
            showerPage.classList.remove('hidden');

            // 模擬進度條跑動 (3秒)
            let width = 0;
            const loadingInterval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(loadingInterval);
                    showerPage.classList.add('hidden');
                    resultPage.classList.remove('hidden');
                } else {
                    width += 2;
                    progressBar.style.width = width + '%';
                }
            }, 60);
        });

        // 點擊禮物盒彈出專屬文字
        function openGift(rewardText) {
            giftText.innerText = rewardText;
            giftModal.classList.remove('hidden');
        }

        // 關閉彈出視窗
        function closeModal() {
            giftModal.classList.add('hidden');
        }
    </script>
</body>
</html>
