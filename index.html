<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roro so cute!</title>
    <style>
        :root {
            --primary-color: #00a0e9; /* KKBOX 經典藍色調 */
            --accent-color: #ff4757;
            --bg-color: #f1f2f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            text-align: center;
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 450px;
            width: 90%;
        }

        h1 {
            color: #1e272e;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #718093;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            line-height: 1.4;
        }

        .box-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 2rem;
            cursor: pointer;
        }

        .lucky-box {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff9f43, #ff6b6b);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            color: white;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
            transition: transform 0.2s;
            position: relative;
            user-select: none;
        }

        .lucky-box::after {
            content: "？";
            font-weight: bold;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shaking {
            animation: shake 0.5s infinite;
        }

        .btn-draw {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.8rem 2.5rem;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 160, 233, 0.3);
            transition: all 0.3s ease;
        }

        .btn-draw:hover {
            background-color: #0082bc;
            transform: translateY(-2px);
        }

        .btn-draw:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 85%;
            transform: scale(0.8);
            transition: transform 0.3s ease;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .prize-tag {
            font-size: 1.1rem;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 0.8rem;
            letter-spacing: 1px;
        }

        .prize-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        /* 提示再抽一次的樣式 */
        .hint-text {
            display: none;
            background-color: #ebf8ff;
            color: #2b6cb0;
            padding: 0.6rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            border: 1px dashed #bee3f8;
        }

        .btn-close {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 0.6rem 2rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-close:hover {
            background-color: #1a252f;
        }

        .status-text {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎁 若若洗澡鼓勵獎</h1>
        <div class="subtitle">總共 3 支幸運籤，點擊按鈕試試手氣吧！</div>

        <div class="box-container">
            <div class="lucky-box" id="luckyBox"></div>
        </div>

        <button class="btn-draw" id="drawBtn" onclick="drawPrize()">點擊抽籤</button>
        
        <div class="status-text" id="statusText">目前剩餘：6 支籤</div>
    </div>

    <!-- 結果視窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div style="font-size: 3.5rem; margin-bottom: 1rem;" id="modalEmoji">🎉</div>
            <div class="prize-tag" id="modalPrizeTag">抽中獎項</div>
            <div class="prize-name" id="modalPrizeName">內容</div>
            <!-- 提示區塊 -->
            <div class="hint-text" id="modalHint">💡 提示：再抽一次！看看會不會抽到實體禮物🎁</div>
            <button class="btn-close" onclick="closeModal()">收下好運</button>
        </div>
    </div>

    <script>
        // 3個實體大獎 + 3個精選祝福籤
        let pool = [
            { isRealPrize: true, type: "實體獎勵", name: "☕️ 星巴克西西里咖啡 + 🍰 蛋糕一份", emoji: "🎁" },
            { isRealPrize: true, type: "實體獎勵", name: "🚗 下班 Uber 免費搭乘一趟", emoji: "🎁" },
            { isRealPrize: true, type: "實體獎勵", name: "🎫 週五工作咖啡廳入場券乙張", emoji: "🎁" },
            
            { isRealPrize: false, type: "新人防護罩", name: "❤️ 適應期辛苦了！你已經表現得很棒囉！", emoji: "🛡️" },
            { isRealPrize: false, type: "客戶乖乖籤", name: "🧘 祝你遇到的客戶都不改需求、不砍預算，順利過關！", emoji: "🛸" },
            { isRealPrize: false, type: "下班節奏籤", name: "🏃 明天工作進度開外掛！下班時間一到快速登出辦公室！", emoji: "⚡️" }
        ];

        const luckyBox = document.getElementById('luckyBox');
        const drawBtn = document.getElementById('drawBtn');
        const statusText = document.getElementById('statusText');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalPrizeName = document.getElementById('modalPrizeName');
        const modalPrizeTag = document.getElementById('modalPrizeTag');
        const modalEmoji = document.getElementById('modalEmoji');
        const modalHint = document.getElementById('modalHint');

        function drawPrize() {
            if (pool.length === 0) return;

            drawBtn.disabled = true;
            luckyBox.classList.add('shaking');

            setTimeout(() => {
                luckyBox.classList.remove('shaking');

                const randomIndex = Math.floor(Math.random() * pool.length);
                const winPrize = pool.splice(randomIndex, 1)[0]; 

                // 顯示結果
                modalEmoji.innerText = winPrize.emoji;
                modalPrizeTag.innerText = `【 ${winPrize.type} 】`;
                modalPrizeName.innerText = winPrize.name;
                
                // 檢查是否為大獎，如果不是，且池子裡還有籤，就顯示「再抽一次」的提示
                if (!winPrize.isRealPrize && pool.length > 0) {
                    modalHint.style.display = "block";
                } else {
                    modalHint.style.display = "none";
                }

                modalOverlay.classList.add('active');

                // 更新剩餘狀態
                if (pool.length > 0) {
                    statusText.innerText = `目前剩餘：${pool.length} 支籤`;
                    drawBtn.innerText = "再抽一張";
                    drawBtn.disabled = false;
                } else {
                    statusText.innerText = "⚠️ 所有的籤都被抽完囉！業務人生正式起飛！";
                    drawBtn.innerText = "抽籤完畢";
                    drawBtn.disabled = true;
                }
            }, 1000);
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }
    </script>
</body>
</html>
